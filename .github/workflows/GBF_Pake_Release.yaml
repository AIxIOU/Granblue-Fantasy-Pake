# Public release builds of Granblue Fantasy nPake: six installers, one per
# platform per region.
#
# nPake is built FROM THIS REPOSITORY'S SOURCE with the Tauri CLI. It is not
# the v1 model (Pake CLI + an injected gbf-scaler.js); that line is archived on
# branch archive/overlay-v1.
#
# Triggered by pushing a version tag (v2.0.0-1), or dispatched manually for a
# dry run. Dry-run on the PRIVATE dev repo first -- see
# GBF_Pake_RULES_AND_HANDOFF.md.
#
# Why six: Steam and Japanese Granblue are different sites, built as separate
# apps with separate identifiers so a player can install both and run them at
# the same time.
name: Public Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version: MAJOR.MINOR.PATCH with optional numeric pre-release, e.g. 2.0.0-1"
        required: true
        default: "0.0.0-1"
      publish:
        description: "Create a GitHub Release (off = build artifacts only)"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false
      only:
        description: "Build only one job for a quick check (blank = all six), e.g. windows-steam"
        required: false
        default: ""

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, region: steam, key: windows-steam, label: "Windows - Steam" }
          - { os: windows-latest, region: jp, key: windows-jp, label: "Windows - Japan" }
          - { os: macos-latest, region: steam, key: macos-steam, label: "macOS - Steam" }
          - { os: macos-latest, region: jp, key: macos-jp, label: "macOS - Japan" }
          - { os: ubuntu-24.04, region: steam, key: linux-steam, label: "Linux - Steam" }
          - { os: ubuntu-24.04, region: jp, key: linux-jp, label: "Linux - Japan" }

    steps:
      - name: Skip jobs not selected
        id: gate
        shell: bash
        run: |
          ONLY="${{ inputs.only }}"
          if [ -n "$ONLY" ] && [ "$ONLY" != "${{ matrix.key }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Full history: build.rs stamps the build number from `git rev-list
      # --count HEAD`. A shallow checkout would make every release "Build 1".
      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version and region
        if: steps.gate.outputs.run == 'true'
        id: cfg
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RAW="${GITHUB_REF_NAME#v}"
          else
            RAW="${{ inputs.version }}"
          fi

          # ONE VERSION STRING, VALID ON EVERY PLATFORM. Numeric pre-release
          # only: the Windows MSI packager rejects labels like -beta.1.
          if ! printf '%s' "$RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]{1,5})?$'; then
            echo "::error::Version '$RAW' is not usable. Use MAJOR.MINOR.PATCH with an optional numeric pre-release: 2.0.0-1 (beta 1), 2.0.0-2, then 2.0.0."
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"

          if [ "${{ matrix.region }}" = "jp" ]; then
            echo "url=https://game.granbluefantasy.jp" >> "$GITHUB_OUTPUT"
            echo "appname=Granblue Fantasy nPake JP" >> "$GITHUB_OUTPUT"
            echo "identifier=com.gbf.npake.jp" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://steam.granbluefantasy.com" >> "$GITHUB_OUTPUT"
            echo "appname=Granblue Fantasy nPake" >> "$GITHUB_OUTPUT"
            echo "identifier=com.gbf.npake" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup build environment
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-env
        with:
          mode: build

      # Region and version are the only things that differ between the six
      # builds. They are written into the app's own config files here, so the
      # compiled app and the installer agree.
      - name: Configure app for this region and version
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          APP_VERSION: ${{ steps.cfg.outputs.version }}
          APP_NAME: ${{ steps.cfg.outputs.appname }}
          APP_ID: ${{ steps.cfg.outputs.identifier }}
          APP_URL: ${{ steps.cfg.outputs.url }}
        run: |
          node -e '
            const fs = require("fs");
            const conf = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(conf, "utf8"));
            c.productName = process.env.APP_NAME;
            c.identifier = process.env.APP_ID;
            c.version = process.env.APP_VERSION;
            fs.writeFileSync(conf, JSON.stringify(c, null, 2));
            const pj = "src-tauri/pake.json";
            const p = JSON.parse(fs.readFileSync(pj, "utf8"));
            p.windows[0].url = process.env.APP_URL;
            fs.writeFileSync(pj, JSON.stringify(p, null, 2));
            console.log(c.productName, c.identifier, c.version, p.windows[0].url);
          '

      - name: Build app
        if: steps.gate.outputs.run == 'true'
        shell: bash
        timeout-minutes: 50
        run: |
          # One .dmg that runs on both Apple Silicon and Intel.
          if [ "$RUNNER_OS" = "macOS" ]; then
            pnpm tauri build --target universal-apple-darwin
          else
            pnpm tauri build
          fi

      - name: Collect installers
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p dist-release
          find src-tauri/target -type f -path "*/bundle/*" \( -name "*.msi" -o -name "*.dmg" \
            -o -name "*.deb" -o -name "*.AppImage" \) -print0 |
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              ext="${base##*.}"
              cp "$f" "dist-release/GranblueFantasyNPake-${{ matrix.region }}-${{ steps.cfg.outputs.version }}-$RUNNER_OS.$ext"
            done
          ls -la dist-release/
          if [ -z "$(ls -A dist-release)" ]; then
            echo "::error::No installer produced for ${{ matrix.label }}"
            exit 1
          fi

      - name: Upload installers
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: gbf-npake-${{ matrix.region }}-${{ runner.os }}
          path: dist-release/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag' || inputs.publish
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -la artifacts/

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            V="${{ inputs.version }}"
            TAG="v${{ inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Derived from the version: inputs are EMPTY on a tag push, so a
          # labelled tag would otherwise publish as a full release.
          case "$V" in
            *-*) PRE=true ;;
            *)   PRE=${{ inputs.prerelease || false }} ;;
          esac
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Granblue Fantasy nPake ${{ steps.v.outputs.version }}
          prerelease: ${{ steps.v.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            ## Beta

            nPake is a rebuilt version of this app and replaces the 1.x
            releases. It has been played and tested on **Windows with Steam
            Granblue**. macOS, Linux and the Japanese site are **untested** —
            please report what you find.

            Settings and logins from 1.x do not carry over; log in once.

            ## Which file do I download?

            | Your system | Steam Granblue | Japanese Granblue |
            |---|---|---|
            | Windows | `...-steam-...-Windows.msi` | `...-jp-...-Windows.msi` |
            | macOS | `...-steam-...-macOS.dmg` | `...-jp-...-macOS.dmg` |
            | Linux | `...-steam-...-Linux.deb` / `.AppImage` | `...-jp-...-Linux.deb` / `.AppImage` |

            The Steam and Japanese builds are separate apps. You can install
            both and run them at the same time.

            ## What's new in nPake

            - Uses Granblue's lighter phone version by default, and never
              reloads when you resize the window.
            - Sidebar shortcuts, a built-in wiki, and a **second Granblue view**
              in the same window.
            - Options for extra windows, colour themes, system tray and more.
            - **Not a mod.** Granblue Fantasy is never changed; the app is a
              small standalone web viewer with its own features beside the game.

            ## First launch

            These builds are **not code-signed**, so your system will warn you.
            Nothing is wrong; signing certificates cost money and this is a
            free, open-source app.

            **macOS** - you will see *"Granblue Fantasy nPake is damaged and
            can't be opened."* It is not damaged; macOS adds a quarantine flag
            to unsigned downloads. After dragging the app to Applications, run
            this once in Terminal:

            ```
            xattr -cr "/Applications/Granblue Fantasy nPake.app"
            ```

            (For the Japanese build, use `Granblue Fantasy nPake JP.app`.)

            **Windows** - SmartScreen shows a blue warning. Click **More info**
            then **Run anyway**.

            **Linux** - `sudo dpkg -i GranblueFantasyNPake-*.deb`, or `chmod +x`
            the `.AppImage` and run it.

            Community: https://discord.gg/grGv4Th5cE
