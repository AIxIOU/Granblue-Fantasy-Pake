# Public release builds: six installers, one per platform per region.
#
# Triggered by pushing a version tag (v1.2.3), or dispatched manually with a
# version for a dry run. Exercise dispatches on the PRIVATE dev repo first --
# see GBF_Pake_RULES_AND_HANDOFF.md.
#
# Why six: Steam and Japanese Granblue are different sites, built as separate
# apps with separate identifiers so a player can install both and run them at
# the same time.
name: Public Release

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version: MAJOR.MINOR.PATCH with optional numeric pre-release, e.g. 1.0.0-1"
        required: true
        default: "0.0.0-1"
      publish:
        description: "Create a GitHub Release (off = build artifacts only)"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, region: steam, label: "Windows - Steam" }
          - { os: windows-latest, region: jp, label: "Windows - Japan" }
          - { os: macos-latest, region: steam, label: "macOS - Steam" }
          - { os: macos-latest, region: jp, label: "macOS - Japan" }
          - { os: ubuntu-24.04, region: steam, label: "Linux - Steam" }
          - { os: ubuntu-24.04, region: jp, label: "Linux - Japan" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve version and region
        id: cfg
        shell: bash
        run: |
          # A tag is the source of truth for released versions; the dispatch
          # input exists so this can be exercised without tagging.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RAW="${GITHUB_REF_NAME#v}"
          else
            RAW="${{ inputs.version }}"
          fi

          # ONE VERSION STRING, VALID ON EVERY PLATFORM. No translation.
          #
          # Semver with an optional NUMERIC pre-release identifier:
          #   1.0.0-1   beta 1        1.0.0-2   beta 2        1.0.0   final
          #
          # Numeric is not a stylistic choice. Measured on a dry run with
          # 0.0.0-test: macOS and Linux built, both Windows jobs failed with
          #   "optional pre-release identifier in app version must be
          #    numeric-only and cannot be greater than 65535 for msi target"
          # So this is the only pre-release form the MSI packager accepts, and
          # using it directly means the tag, the compiled version, the release
          # title and the filenames are all the same string.
          if ! printf '%s' "$RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]{1,5})?$'; then
            echo "::error::Version '$RAW' is not usable. Use MAJOR.MINOR.PATCH with an optional numeric pre-release: 1.0.0-1 (beta 1), 1.0.0-2, then 1.0.0. Labels like -beta.1 fail the Windows MSI packager."
            exit 1
          fi
          VERSION="$RAW"
          echo "version -> $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "label=$VERSION" >> "$GITHUB_OUTPUT"

          # Distinct names -> distinct bundle identifiers -> both regions can
          # be installed side by side and run at the same time.
          if [ "${{ matrix.region }}" = "jp" ]; then
            echo "url=https://game.granbluefantasy.jp" >> "$GITHUB_OUTPUT"
            echo "appname=Granblue Fantasy Pake JP" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://steam.granbluefantasy.com" >> "$GITHUB_OUTPUT"
            echo "appname=Granblue Fantasy Pake" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Build app
        shell: bash
        timeout-minutes: 35
        run: |
          SCRIPT="$GITHUB_WORKSPACE/.github/scripts/gbf-scaler.js"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Missing $SCRIPT"
            exit 1
          fi

          # --multi-window, NOT --multi-instance. Granblue players want a
          # second window for parties or inventory while a raid is live, and
          # these two flags are mutually exclusive in Pake:
          #
          #   if !multi_instance {                    // single-instance plugin
          #       if multi_window { open_additional_window_safe(app) }
          #   }
          #
          # So the additional-window path only exists while multi_instance is
          # FALSE. Shipping --multi-instance in 1.0.0-1 gave separate processes
          # whose windows stacked at the same saved position, which looked like
          # nothing happened. One app, several windows is what was wanted.
          ARGS=(
            "${{ steps.cfg.outputs.url }}"
            "--name" "${{ steps.cfg.outputs.appname }}"
            "--inject" "$SCRIPT"
            "--icon" "./icon/gbf-europa-icon.png"
            "--multi-window"
            "--app-version" "${{ steps.cfg.outputs.version }}"
            "--width" "900" "--height" "820"
            "--min-width" "700" "--min-height" "570"
          )

          # One .dmg that runs on both Apple Silicon and Intel, rather than
          # shipping two more artifacts.
          if [ "$RUNNER_OS" = "macOS" ]; then
            ARGS+=("--multi-arch")
          fi

          echo "Running: node dist/cli.js ${ARGS[*]}"
          node dist/cli.js "${ARGS[@]}"

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-release
          # Bundle names vary by platform and version, so collect by extension
          # rather than guessing the filename.
          find . -type f \( -name "*.msi" -o -name "*.dmg" -o -name "*.deb" \
            -o -name "*.AppImage" -o -name "*.rpm" \) \
            -not -path "./dist-release/*" -print0 |
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              ext="${base##*.}"
              cp "$f" "dist-release/GranblueFantasyPake-${{ matrix.region }}-${{ steps.cfg.outputs.label }}-$RUNNER_OS.$ext"
            done
          ls -la dist-release/
          if [ -z "$(ls -A dist-release)" ]; then
            echo "::error::No installer produced for ${{ matrix.label }}"
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: gbf-pake-${{ matrix.region }}-${{ runner.os }}
          path: dist-release/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag' || inputs.publish
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -la artifacts/

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            V="${{ inputs.version }}"
            TAG="v${{ inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # ANY pre-release label marks the release as a pre-release.
          #
          # Derived from the version rather than taken from the dispatch input,
          # because inputs are EMPTY on a tag push -- so a v1.0.0-beta.1 tag
          # would otherwise have published as a full release, which is the
          # opposite of what the tag says. The manual input can still force it
          # on for a build that has no label.
          case "$V" in
            *-*) PRE=true ;;
            *)   PRE=${{ inputs.prerelease || false }} ;;
          esac
          echo "Release $TAG -> prerelease=$PRE"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Granblue Fantasy Pake ${{ steps.v.outputs.version }}
          prerelease: ${{ steps.v.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            ## Which file do I download?

            | Your system | Steam Granblue | Japanese Granblue |
            |---|---|---|
            | Windows | `...-steam-...-Windows.msi` | `...-jp-...-Windows.msi` |
            | macOS | `...-steam-...-macOS.dmg` | `...-jp-...-macOS.dmg` |
            | Linux | `...-steam-...-Linux.deb` / `.AppImage` | `...-jp-...-Linux.deb` / `.AppImage` |

            The Steam and Japanese builds are separate apps. You can install
            both and run them at the same time.

            ## Multiple windows at once

            Open the app again and you get a **second window in the same app**,
            so you can manage parties or inventory while a raid is running.
            Close a window and the rest keep going.

            ## First launch

            These builds are **not code-signed**, so your system will warn you.
            Nothing is wrong; signing certificates cost money and this is a
            free, open-source wrapper.

            **macOS** - you will see *"Granblue Fantasy Pake is damaged and
            can't be opened."* It is not damaged; macOS adds a quarantine flag
            to unsigned downloads. After dragging the app to Applications, run
            this once in Terminal:

            ```
            xattr -cr "/Applications/Granblue Fantasy Pake.app"
            ```

            (For the Japanese build, use `Granblue Fantasy Pake JP.app`.)

            **Windows** - SmartScreen shows a blue warning. Click **More info**
            then **Run anyway**.

            **Linux** - installs normally:

            ```
            sudo dpkg -i GranblueFantasyPake-*.deb
            ```

            Or use the `.AppImage`: `chmod +x` it and run it.

            ## What this is

            A desktop wrapper for Granblue Fantasy with a navigation sidebar,
            a built-in wiki panel and an About page. **The game itself is never
            modified** - it runs exactly as it does in a browser. The app reads
            the game's layout to position the sidebar and nothing more.

            Press **Alt+W** for the wiki, **Alt+L** to lock or unlock the
            sidebar, and see the in-app **About** page for the full shortcut
            list.
