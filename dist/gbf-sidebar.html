<!doctype html>
<meta charset="utf-8" />
<title>Granblue Sidebar</title>
<!--
  EXPERIMENT ONLY. The native sidebar's page.

  This document is NOT part of Granblue's origin. It is bundled app content
  served from tauri://localhost, rendered in its own webview beside the game.
  Nothing here can see or touch the game's DOM, which is the entire point:
  Rule 0 is enforced by the process boundary instead of by our own discipline.

  Navigation goes out over IPC to Rust, which sets location.hash on the game
  webview -- the same thing clicking Granblue's own menu does.
-->
<style>
  :root, html[data-theme="midnight"] {
    --bg: #14171f;
    --bg-hover: #1e2330;
    --bg-deep: #10131a;
    --fg: #c9d1e0;
    --fg-bright: #ffffff;
    --fg-dim: #6b7688;
    --accent: #7aa2f7;
    --line: #232838;
    --badge-ink: #0d1017;
    --notice-bg: #2a2f3a;
    --notice-fg: #e8eaf0;
    --notice-line: #3d4552;
    --dbg-bg: #0b0e14;
    --dbg-fg: #9ece6a;
  }
  html[data-theme="ember"] {
    --bg: #1c1410;
    --bg-hover: #2c1e16;
    --bg-deep: #140e0a;
    --fg: #eadcc8;
    --fg-bright: #fff6e8;
    --fg-dim: #9a7d5c;
    --accent: #e8a04a;
    --line: #3d2c20;
    --badge-ink: #1a1208;
    --notice-bg: #3a2a1c;
    --notice-fg: #f0e4d0;
    --notice-line: #5c4630;
    --dbg-bg: #120e0b;
    --dbg-fg: #d4c070;
  }
  html[data-theme="tide"] {
    --bg: #0e181a;
    --bg-hover: #162428;
    --bg-deep: #0a1214;
    --fg: #c8ddd8;
    --fg-bright: #e8fffa;
    --fg-dim: #5e7a76;
    --accent: #3ecfb2;
    --line: #1c3034;
    --badge-ink: #061210;
    --notice-bg: #1a2c30;
    --notice-fg: #d4eeea;
    --notice-line: #2a484c;
    --dbg-bg: #0a1012;
    --dbg-fg: #6ee0c4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    user-select: none; cursor: default;
  }
  body { display: flex; flex-direction: column; }

  #top {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  #toggle {
    width: 28px; height: 28px; flex: 0 0 auto;
    display: grid; place-items: center;
    background: none; border: 1px solid var(--line); border-radius: 6px;
    color: var(--fg); font-size: 14px; cursor: pointer;
  }
  #toggle:hover { background: var(--bg-hover); border-color: var(--accent); }
  #brand { font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
  #badge {
    margin-left: auto; font-size: 9px; letter-spacing: .5px;
    color: var(--badge-ink); background: var(--accent);
    padding: 2px 5px; border-radius: 3px; white-space: nowrap;
  }

  #wikibar {
    display: flex; gap: 6px; padding: 6px 10px; flex: 0 0 auto;
    border-bottom: 1px solid var(--line); background: var(--bg-deep);
  }
  #wikibar[hidden] { display: none; }
  /* .btn and .sec set their own `display`, which beats the browser's default
     [hidden] rule -- so hiding a row with el.hidden silently did nothing.
     This makes `hidden` authoritative for every element on the page. */
  [hidden] { display: none !important; }
  .wbtn {
    flex: 1 1 auto; padding: 4px 0;
    background: none; border: 1px solid var(--line); border-radius: 5px;
    color: var(--fg); font: inherit; font-size: 12px; cursor: pointer;
  }
  .wbtn:hover { background: var(--bg-hover); border-color: var(--accent); }
  body.collapsed #wikibar { display: none; }

  /* The only scrolling region. */
  #nav { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 6px 0; }
  #nav::-webkit-scrollbar { width: 8px; }
  #nav::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .sec {
    padding: 10px 12px 4px; font-size: 10px; letter-spacing: .8px;
    color: var(--fg-dim); text-transform: uppercase; white-space: nowrap;
  }
  .btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 7px 12px;
    background: none; border: 0; color: var(--fg);
    font: inherit; text-align: left; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--bg-hover); color: var(--fg-bright); }
  .btn.active { background: var(--bg-hover); color: var(--fg-bright); box-shadow: inset 2px 0 0 var(--accent); }
  .btn .ico { width: 18px; flex: 0 0 auto; text-align: center; font-size: 14px; }
  .btn .lbl { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .btn .key { color: var(--fg-dim); font-size: 10px; }

  /* Mobile only. Icon + Large / Small text; active word highlighted. */
  #game-size { flex: 0 0 auto; width: 100%; }
  .size-line {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 7px 12px 10px;
    border: 0;
    background: none;
    color: var(--fg);
    font: inherit;
    text-align: left;
  }
  .size-line .ico {
    width: 18px;
    flex: 0 0 auto;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
  }
  .size-toggle {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    width: max-content;
    gap: 8px;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
  }
  .size-opt {
    appearance: none;
    -webkit-appearance: none;
    padding: 0;
    background: transparent;
    border: 0;
    box-shadow: none;
    outline: none;
    color: var(--fg-dim);
    font: inherit;
    cursor: pointer;
  }
  .size-opt:hover { color: var(--fg); background: transparent; }
  .size-opt.active {
    color: var(--accent);
    font-weight: 600;
    background: transparent;
    box-shadow: none;
  }
  body.collapsed .size-line {
    justify-content: center;
    padding: 8px 0;
  }
  body.collapsed .size-toggle { display: none; }

  #dbg {
    position: fixed; left: 0; right: 0; bottom: 26px;
    margin: 0; padding: 6px 8px; max-height: 46%; overflow: auto;
    background: var(--dbg-bg); color: var(--dbg-fg); border-top: 1px solid var(--accent);
    font: 10px/1.35 ui-monospace, Consolas, monospace; white-space: pre-wrap;
    word-break: break-all; display: none;
  }
  #dbg.on { display: block; }
  #actions {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    padding: 4px 10px 8px;
    background: var(--bg-deep);
  }
  #actions .sec { padding: 6px 2px 6px; }
  .act-row { display: flex; gap: 6px; }
  .act-row .wbtn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  body.collapsed #actions .sec,
  body.collapsed #actions .lbl { display: none; }
  body.collapsed .act-row { flex-direction: column; }
  body.collapsed #actions { padding: 6px 8px; }

  #foot {
    flex: 0 0 auto; border-top: 1px solid var(--line);
    padding: 7px 12px; font-size: 10px; color: var(--fg-dim); white-space: nowrap;
  }
  /* Hidden unless Options turns the bottom debugger on. */
  body:not(.debug) #foot,
  body:not(.debug) #dbg { display: none !important; }

  /* Collapsed: icons only. Because this is a separate document, collapsing
     changes nothing about the game's own layout -- Rust just makes the webview
     narrower. On main this required a body inset and a density refit. */
  body.collapsed #brand,
  body.collapsed #badge,
  body.collapsed .sec,
  body.collapsed .btn .lbl,
  body.collapsed .btn .key,
  body.collapsed #foot { display: none; }
  body.collapsed #top { justify-content: center; padding: 8px 0; }
  body.collapsed .btn { justify-content: center; padding: 8px 0; }
  /* Transient notice. Sits over the nav so a deliberate click gets a
     deliberate answer -- the footer is where diagnostics go, and it is
     too quiet for this. */
  #notice {
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: 96px;
    z-index: 40;
    padding: 10px 12px;
    border-radius: 6px;
    background: var(--notice-bg);
    color: var(--notice-fg);
    border: 1px solid var(--notice-line);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    font-size: 12px;
    line-height: 1.45;
    opacity: 0;
    transition: opacity 140ms ease;
    pointer-events: none;
  }
  #notice.on { opacity: 1; }
  body.collapsed #notice { display: none; }
</style>

<div id="top">
  <button id="toggle" title="Collapse / expand the sidebar">&#9776;</button>
  <span id="brand">Granblue</span>
  <span id="badge">NATIVE</span>
</div>
<div id="wikibar" hidden>
  <button class="wbtn" id="wback" title="Back in the wiki">&#8592;</button>
  <button class="wbtn" id="whome" title="Wiki front page">&#8962;</button>
  <button class="wbtn" id="wclose" title="Close this panel">&#10005;</button>
</div>
<div id="nav"></div>
<div id="notice" role="status" aria-live="polite"></div>
<div id="actions">
  <div class="sec" id="sec-actions">Actions</div>
  <div class="act-row">
    <button type="button" class="wbtn" id="gback" title="Back in Granblue (Alt+Left)">
      <span class="ico">&#8592;</span><span class="lbl">Back</span>
    </button>
    <button type="button" class="wbtn" id="greload" title="Reload Granblue (Alt+R)">
      <span class="ico">&#8635;</span><span class="lbl">Reload</span>
    </button>
  </div>
</div>
<div id="foot">starting…</div>
<pre id="dbg"></pre>

<script>
  // Mirrors the NAV table in gbf-scaler.js so the two builds are comparable.
  var NAV = [
    { section: "Navigation" },
    { label: "Home",          hash: "#mypage",                   icon: "⌂", key: "1" },
    { label: "Party",         hash: "#party/index/0/npc/0",      icon: "⚔", key: "P" },
    { label: "Quests",        hash: "#quest",                    icon: "☷", key: "2" },
    { label: "Raids",         hash: "#quest/assist",             icon: "☠", key: "3" },
    { label: "Co-op",         hash: "#coopraid",                 icon: "⇄", key: "4" },
    { label: "Crew",          hash: "#guild",                    icon: "⚑", key: "5" },

    { section: "Management" },
    { label: "Supplies",      hash: "#item",                     icon: "◈", key: "6" },
    { label: "Inventory",     hash: "#list",                     icon: "≡", key: "7" },
    { label: "Crate",         hash: "#present",                  icon: "▣", key: "C" },
    { label: "Stash",         hash: "#container",                icon: "⚿", key: "S" },
    { label: "Profile",       hash: "#profile",                  icon: "☺", key: "8" },

    { section: "More" },
    { label: "Shop",          hash: "#shop",                     icon: "⛁", key: "9" },
    { label: "Journey Drops", hash: "#shop/exchange/trajectory", icon: "✧", key: "0" },
    { label: "Arcarum",       hash: "#arcarum",                  icon: "☆", key: "-" },
    { label: "Alchemy Lab",   hash: "#frontier/alchemy/top",     icon: "⚗", key: "=" },
    { label: "Trial Battles", hash: "#trial_battle",             icon: "⚔", key: "[" },
    { label: "Casino",        hash: "#casino",                   icon: "♠", key: "]" },
    { label: "Gacha",         hash: "#gacha",                    icon: "❈", key: ";" },

    { section: "Layout" },
    // Desktop only. Hide the chat column (exception 2) and snap to #wrapper.
    { label: "Lock to game", cmd: "gbf_toggle_lock", id: "nav-lock", icon: "🔒", key: "L" },

    { section: "Reference" },
    { label: "Wiki", cmd: "gbf_wiki_toggle", id: "nav-wiki", icon: "⊞", key: "W" },

    { section: "App" },
    { label: "Options", cmd: "gbf_options_toggle", id: "nav-options", icon: "⚙" },
    { label: "About", cmd: "gbf_about_toggle", id: "nav-about", icon: "ⓘ" }
  ];

  // This webview is not exposed as a CDP target, so its console cannot be read
  // from outside. Diagnostics go on screen instead, into the footer.
  function say(msg) {
    var f = document.getElementById("foot");
    if (f) f.textContent = String(msg).slice(0, 120);
  }

  // Transient on-screen notice. Collapsed rail has no room, so setState
  // hides it there; the footer still carries the text.
  var noticeTimer = 0;
  function showNotice(msg) {
    var n = document.getElementById("notice");
    say(msg);
    if (!n) return;
    n.textContent = String(msg);
    n.className = "on";
    if (noticeTimer) clearTimeout(noticeTimer);
    noticeTimer = setTimeout(function () {
      n.className = "";
      noticeTimer = 0;
    }, 6000);
  }

  function invoke(cmd, args) {
    var t = window.__TAURI__;
    if (!t) return Promise.reject(new Error("no __TAURI__"));
    if (!t.core || !t.core.invoke) {
      return Promise.reject(new Error("__TAURI__ keys: " + Object.keys(t).join(",")));
    }
    return t.core.invoke(cmd, args);
  }

  window.addEventListener("error", function (e) {
    say("js error: " + e.message);
  });

  function dump(text) {
    var d = document.getElementById("dbg");
    if (!d) return;
    d.textContent = String(text);
    // Do not force the overlay on. It sits over the nav and hid the last
    // items. Footer click still toggles it.
  }

  function refreshDebug() {
    invoke("gbf_debug")
      .then(dump)
      .catch(function (e) { dump("gbf_debug FAILED: " + (e && e.message ? e.message : e)); });
  }

  (function reportIpc() {
    var t = window.__TAURI__;
    if (!t) { say("NO __TAURI__ global"); return; }
    if (!t.core || !t.core.invoke) { say("__TAURI__: " + Object.keys(t).join(",")); return; }
    say("ipc ready — click here for diagnostics");
    window.refreshDebug = refreshDebug;
    if (document.body.classList.contains("debug")) refreshDebug();
    var f = document.getElementById("foot");
    if (f) {
      f.style.cursor = "pointer";
      f.addEventListener("click", function () {
        var d = document.getElementById("dbg");
        if (d) d.className = d.className === "on" ? "" : "on";
      });
    }
  })();

  var nav = document.getElementById("nav");
  NAV.forEach(function (item) {
    if (item.section) {
      var s = document.createElement("div");
      s.className = "sec";
      s.textContent = item.section;
      s.id = "sec-" + item.section.toLowerCase();
      nav.appendChild(s);
      return;
    }
    var b = document.createElement("button");
    b.className = "btn";
    b.title = item.label;

    var ico = document.createElement("span");
    ico.className = "ico";
    ico.textContent = item.icon;
    var lbl = document.createElement("span");
    lbl.className = "lbl";
    lbl.textContent = item.label;
    var key = document.createElement("span");
    key.className = "key";
    key.textContent = item.key || "";
    b.appendChild(ico);
    b.appendChild(lbl);
    b.appendChild(key);

    if (item.id) b.id = item.id;
    if (item.hash) b.setAttribute("data-hash", item.hash);
    b.addEventListener("click", function () {
      if (item.cmd) {
        say(item.label + "…");
        invoke(item.cmd, item.args || {})
          .then(function (r) {
            if (typeof r === "string" && r.indexOf("NOTICE ") === 0) {
              showNotice(r.slice(7));
              return;
            }
            say(item.label + " ok");
            dump(r);
          })
          .catch(function (e) { say(String(e && e.message ? e.message : e)); });
        return;
      }
      say("nav " + item.label + "…");
      invoke("gbf_nav", { hash: item.hash })
        .then(function () { say("nav ok: " + item.label); })
        .catch(function (e) { say("nav FAILED: " + (e && e.message ? e.message : e)); });
    });
    nav.appendChild(b);
  });

  (function mountGameSize() {
    var gs = document.createElement("div");
    gs.id = "game-size";
    gs.hidden = true;
    var sec = document.createElement("div");
    sec.className = "sec";
    sec.id = "sec-game-size";
    sec.textContent = "Game size";
    var line = document.createElement("div");
    line.className = "size-line";
    var ico = document.createElement("span");
    ico.className = "ico";
    ico.textContent = "⛶";
    ico.title = "Game size";
    ico.addEventListener("click", function () {
      var half = document.body.getAttribute("data-mobile-half") === "1";
      var next = !half;
      say((next ? "Small" : "Large") + "…");
      invoke("gbf_set_mobile_half", { half: next })
        .then(function (r) {
          say((next ? "Small" : "Large") + " ok");
          dump(r);
        })
        .catch(function (e) { say(String(e && e.message ? e.message : e)); });
    });
    var row = document.createElement("div");
    row.className = "size-toggle";
    row.setAttribute("role", "group");
    row.setAttribute("aria-label", "Game size");
    function sizeOpt(id, label, half) {
      var b = document.createElement("span");
      b.className = "size-opt";
      b.id = id;
      b.title = label;
      b.setAttribute("role", "button");
      b.tabIndex = 0;
      b.textContent = label;
      b.addEventListener("click", function () {
        say(label + "…");
        invoke("gbf_set_mobile_half", { half: half })
          .then(function (r) {
            say(label + " ok");
            dump(r);
          })
          .catch(function (e) { say(String(e && e.message ? e.message : e)); });
      });
      return b;
    }
    row.appendChild(sizeOpt("nav-size-full", "Large", false));
    row.appendChild(sizeOpt("nav-size-half", "Small", true));
    line.appendChild(ico);
    line.appendChild(row);
    gs.appendChild(sec);
    gs.appendChild(line);
    var ref = document.getElementById("sec-reference");
    if (ref) nav.insertBefore(gs, ref);
    else nav.appendChild(gs);
  })();

  document.getElementById("gback").addEventListener("click", function () {
    say("back…");
    invoke("gbf_game_back")
      .then(function () { say("back ok"); })
      .catch(function (e) { say(String(e && e.message ? e.message : e)); });
  });
  document.getElementById("greload").addEventListener("click", function () {
    say("reload…");
    invoke("gbf_game_reload")
      .then(function () { say("reload ok"); })
      .catch(function (e) { say(String(e && e.message ? e.message : e)); });
  });

  document.getElementById("wback").addEventListener("click", function () {
    invoke("gbf_wiki_back").catch(function (e) { say(String(e)); });
  });
  document.getElementById("whome").addEventListener("click", function () {
    invoke("gbf_wiki_home").catch(function (e) { say(String(e)); });
  });
  document.getElementById("wclose").addEventListener("click", function () {
    var p = window.__gbfPanel || {};
    var cmd = p.options ? "gbf_options_toggle" : p.about ? "gbf_about_toggle" : "gbf_wiki_toggle";
    invoke(cmd)
      .then(dump)
      .catch(function (e) { say(String(e && e.message ? e.message : e)); });
  });

  document.getElementById("toggle").addEventListener("click", function () {
    say("toggle…");
    invoke("gbf_toggle_sidebar")
      .then(function (c) { say("toggle ok"); dump(c); })
      .catch(function (e) { say("toggle FAILED: " + (e && e.message ? e.message : e)); });
  });

  // Same longest-prefix rule as shipping markActive(): #quest/assist lights
  // Raids, not Quests. Hash is read from the game webview; this page never
  // writes Granblue.
  function markGameHash(h) {
    h = h || "";
    var best = null;
    var buttons = document.querySelectorAll("#nav .btn[data-hash]");
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      b.classList.remove("active");
      var bh = b.getAttribute("data-hash") || "";
      if (!bh) continue;
      if (h === bh || h.indexOf(bh + "/") === 0) {
        if (!best || bh.length > (best.getAttribute("data-hash") || "").length) {
          best = b;
        }
      }
    }
    if (best) best.classList.add("active");
  }

  // Rust owns the collapsed flag and pushes it here after every relayout, so
  // there is only ever one source of truth for it.
  // Rust owns both flags and pushes them here after every relayout, so there
  // is only ever one source of truth for them.
  window.__gbfSidebar = {
    setState: function (st) {
      st = st || {};
      document.body.classList.toggle("collapsed", !!st.collapsed);
      window.__gbfPanel = { wiki: !!st.wikiOpen, about: !!st.aboutOpen, options: !!st.optionsOpen };
      var bar = document.getElementById("wikibar");
      if (bar) bar.hidden = !(st.wikiOpen || st.aboutOpen || st.optionsOpen);
      var back = document.getElementById("wback");
      var home = document.getElementById("whome");
      if (back) back.hidden = !st.wikiOpen;
      if (home) home.hidden = !st.wikiOpen;
      var w = document.getElementById("nav-wiki");
      if (w) w.classList.toggle("active", !!st.wikiOpen);
      var a = document.getElementById("nav-about");
      if (a) a.classList.toggle("active", !!st.aboutOpen);
      var o = document.getElementById("nav-options");
      if (o) o.classList.toggle("active", !!st.optionsOpen);
      var l = document.getElementById("nav-lock");
      if (l) l.classList.toggle("active", !!st.locked);

      // Desktop: Layout (Lock to game). Mobile: Game size (Large / Small).
      var isMobile = !!st.mobile;
      document.body.classList.toggle("mobile", isMobile);
      var layoutSec = document.getElementById("sec-layout");
      if (layoutSec) layoutSec.hidden = isMobile;
      if (l) {
        l.hidden = isMobile;
        l.classList.toggle("active", !isMobile && !!st.locked);
      }
      var gs = document.getElementById("game-size");
      if (gs) gs.hidden = !isMobile || !!st.gameSizesItself;
      document.documentElement.setAttribute("data-theme", st.theme || "midnight");
      document.body.setAttribute("data-mobile-half", st.mobileHalf ? "1" : "0");
      var full = document.getElementById("nav-size-full");
      var half = document.getElementById("nav-size-half");
      if (full) full.classList.toggle("active", isMobile && !st.mobileHalf);
      if (half) half.classList.toggle("active", isMobile && !!st.mobileHalf);
      if (Object.prototype.hasOwnProperty.call(st, "sidebarDebug")) {
        document.body.classList.toggle("debug", !!st.sidebarDebug);
        if (!st.sidebarDebug) {
          var dbg = document.getElementById("dbg");
          if (dbg) dbg.className = "";
        } else {
          refreshDebug();
        }
      }
      if (Object.prototype.hasOwnProperty.call(st, "gameHash")) {
        markGameHash(st.gameHash);
      }
    },

    setGameHash: markGameHash,

    notice: showNotice,
    // Kept so an older Rust build still works against this page.
    setCollapsed: function (on) {
      window.__gbfSidebar.setState({ collapsed: on });
    }
  };

    // Shortcuts also live in gbf-keys.js (game/wiki/about). This copy covers
    // the sidebar document so it does not depend on that script.
    document.addEventListener("keydown", function (e) {
    if (!e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "l" || e.key === "L") {
      if (document.body.classList.contains("mobile")) return;
      e.preventDefault();
      invoke("gbf_toggle_lock")
        .then(dump)
        .catch(function (er) { say(String(er && er.message ? er.message : er)); });
      return;
    }
    if (e.key === "\\") {
      e.preventDefault();
      invoke("gbf_toggle_sidebar")
        .then(dump)
        .catch(function (er) { say(String(er && er.message ? er.message : er)); });
      return;
    }
    if (e.key === "w" || e.key === "W") {
      e.preventDefault();
      invoke("gbf_wiki_toggle")
        .then(dump)
        .catch(function (er) { say(String(er && er.message ? er.message : er)); });
      return;
    }
    if (e.key === "r" || e.key === "R") {
      e.preventDefault();
      location.reload();
      return;
    }
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      history.back();
      return;
    }
    var hit = null;
    NAV.forEach(function (n) {
      if (n.key && n.key.toLowerCase() === String(e.key).toLowerCase()) hit = n;
    });
    if (hit) {
      e.preventDefault();
      invoke("gbf_nav", { hash: hit.hash }).catch(function () {});
    }
  });
</script>
