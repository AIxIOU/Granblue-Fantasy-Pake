<!doctype html>
<meta charset="utf-8" />
<title>Options</title>
<!--
  EXPERIMENT ONLY. Local Options page in its own webview, same as About:
  opening it cannot destroy the wiki or About. Served from tauri://localhost.
-->
<style>
  :root {
    --bg: #14171f;
    --bg-hover: #1e2330;
    --fg: #c9d1e0;
    --fg-dim: #6b7688;
    --accent: #7aa2f7;
    --line: #232838;
    --gold: #f2e2b6;
  }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  #gbf-options-body {
    padding: 18px 22px 26px;
    overflow-y: auto;
    height: 100%;
  }
  #gbf-options-body > * { max-width: 420px; }
  h1 {
    font-size: 18px; margin: 0 0 6px;
    color: var(--gold); letter-spacing: .4px;
    font-weight: 600;
  }
  .badge {
    display: inline-block; font: 9px/1.2 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .5px; color: #0d1017; background: var(--accent);
    padding: 2px 5px; border-radius: 3px; vertical-align: middle;
  }
  p.lede { color: var(--fg-dim); margin: 0 0 16px; }
  h2 {
    font-size: 11px; letter-spacing: .8px; text-transform: uppercase;
    color: var(--fg-dim); margin: 18px 0 8px;
  }
  .choice {
    display: block; width: 100%;
    text-align: left;
    margin: 0 0 8px; padding: 10px 12px;
    background: none; border: 1px solid var(--line); border-radius: 8px;
    color: var(--fg); font: inherit; cursor: pointer;
  }
  .choice:hover { background: var(--bg-hover); border-color: var(--accent); }
  .choice.on {
    border-color: var(--accent);
    box-shadow: inset 3px 0 0 var(--accent);
    background: var(--bg-hover);
  }
  .choice b { display: block; margin-bottom: 2px; color: #fff; }
  .choice span { color: var(--fg-dim); font-size: 12px; }
</style>
<div id="gbf-options-body">
  <h1>Options <span class="badge">NATIVE</span></h1>
  <p class="lede">These apply to this experiment window. Granblue's own
  Browser Settings still live in the game.</p>

  <div id="opt-layout">
  <h2>Wiki and About placement</h2>
  <p class="lede">Where the wiki, About, and this page sit relative to the
  sidebar.</p>
  <button type="button" class="choice" id="opt-inside">
    <b>Inside</b>
    <span>Game, then the panel, then the sidebar.</span>
  </button>
  <button type="button" class="choice" id="opt-outside">
    <b>Outside</b>
    <span>Game, then the sidebar, then the panel on the outer edge.</span>
  </button>
  </div>

  <h2>Granblue client</h2>
  <button type="button" class="choice" id="opt-mobile">
    <b>Mobile (recommended)</b>
    <span>Granblue's phone client. It has no chat column and never reloads when
    you resize the window, so the game keeps up with the frame. The app
    restarts to switch.</span>
  </button>
  <button type="button" class="choice" id="opt-desktop">
    <b>Desktop</b>
    <span>Granblue's PC client, with its Window Size settings. The app
    restarts to switch. On Automatic Resizing the sidebar stays hidden so
    the game can have the whole window.</span>
  </button>

  <h2>Desktop</h2>
  <button type="button" class="choice" id="opt-tray">
    <b>System tray</b>
    <span>Icon in the notification area. Off by default. With it off,
    closing the window quits.</span>
  </button>
</div>
<script>
  function invoke(cmd, args) {
    var t = window.__TAURI__;
    if (!t || !t.core || !t.core.invoke) return Promise.reject(new Error("no IPC"));
    return t.core.invoke(cmd, args || {});
  }
  function paint(outside, tray, desktopClient) {
    document.getElementById("opt-inside").classList.toggle("on", !outside);
    document.getElementById("opt-outside").classList.toggle("on", !!outside);
    document.getElementById("opt-tray").classList.toggle("on", !!tray);
    document.getElementById("opt-mobile").classList.toggle("on", !desktopClient);
    document.getElementById("opt-desktop").classList.toggle("on", !!desktopClient);
  }
  var trayOn = false;
  var desktopOn = false;
  document.getElementById("opt-inside").addEventListener("click", function () {
    invoke("gbf_set_wiki_outside", { outside: false }).then(function () { paint(false, trayOn, desktopOn); });
  });
  document.getElementById("opt-outside").addEventListener("click", function () {
    invoke("gbf_set_wiki_outside", { outside: true }).then(function () { paint(true, trayOn, desktopOn); });
  });
  document.getElementById("opt-tray").addEventListener("click", function () {
    invoke("gbf_set_tray", { on: !trayOn });
  });
  // Switching client restarts the app: a webview's user agent can only be set
  // when it is built.
  document.getElementById("opt-mobile").addEventListener("click", function () {
    if (!desktopOn) return;
    invoke("gbf_set_desktop_client", { desktop: false });
  });
  document.getElementById("opt-desktop").addEventListener("click", function () {
    if (desktopOn) return;
    invoke("gbf_set_desktop_client", { desktop: true });
  });
  window.__gbfOptions = {
    setState: function (st) {
      st = st || {};
      trayOn = !!st.tray;
      desktopOn = !!st.desktopClient;
      var layout = document.getElementById("opt-layout");
      if (layout) layout.hidden = !!st.mobile;
      paint(!!st.wikiOutside, trayOn, desktopOn);
    }
  };
</script>
